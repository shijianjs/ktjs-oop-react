# Per-module wrapper revisions, for modules whose version is `{upstream npm version}-kt.{revision}`.
#
# This repository wraps no npm package: it re-implements the TypeScript `oop-react` library for
# Kotlin/JS, so both of its artifacts carry a hand-written semantic version in their own build
# script and are listed in `semanticModules` in the root build.gradle.kts. The file is kept because
# the root script reads it, and because a future module that does wrap an npm package belongs here.
