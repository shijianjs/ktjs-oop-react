# The single place where Gradle-side versions live. Build scripts reference these through the
# generated `libs` accessor (`libs.kotlin.browser`, `libs.plugins.detekt`, `libs.versions.kotlin`),
# so a version is written down exactly once.
#
# Two neighbouring files deliberately stay outside this catalog, because they are not "a version of
# something this build declares": `package.json` (the upstream npm package this repository wraps;
# Dependabot reads it and the wrapper derives its own version from it) and
# `wrapper-revisions.properties` (the per-module `-kt.N` revision).

[versions]
# Kotlin toolchain and the Gradle plugins that build this repository.
kotlin = "2.4.21"
ksp = "2.3.14"
dokka = "2.3.0"
detekt = "2.0.0-alpha.6"
maven-publish = "0.37.0"

# JetBrains Kotlin/JS type wrappers.
kotlin-wrappers = "2026.11.2"

# The React/MUI wrappers carry the upstream npm version after the wrappers version:
# {kotlin-wrappers}-{react} and {kotlin-wrappers}-{mui}.
react = "2026.11.2-19.3.1"
mui = "2026.11.2-9.5.0"
testing-library-react = "2026.11.2-16.3.2"
testing-library-dom = "2026.11.2-10.4.1"

# Test stack: the browser suite plus the Playwright end-to-end demo suite (JUnit 5
# with Hutool's static server); `junit-pioneer` carries the in-memory filesystem the
# e2e cases use.
playwright = "1.61.0"
junit = "6.1.3"
junit-pioneer = "2.3.0"
hutool = "5.8.48"

# ktjs siblings from this account, consumed as SNAPSHOTs from `mavenLocal` while the
# kit and its consumers are changed together. `ktjs-docusaurus` is the docs wrapper,
# `ktjs-docusaurus-kit` the toolbox whose home sections the landing page uses.
ktjs-docusaurus = "3.10.2-kt.2-SNAPSHOT"
ktjs-docusaurus-kit = "0.1.0-SNAPSHOT"

# ktjs-docusaurus's Gradle plugin: its own `-kt.N` revision.
ktjs-docusaurus-gradle-plugin = "3.10.2-kt.1"

# npm versions Gradle has to know about (the npm list itself is `package.json`):
# `@docusaurus/theme-mermaid` stays on the wrapper's `@docusaurus/*` line, and the npm
# workspace shares a single webpack.
docusaurus = "3.10.2"
webpack = "5.108.1"

[libraries]
kotlin-browser = { module = "org.jetbrains.kotlin-wrappers:kotlin-browser", version.ref = "kotlin-wrappers" }

# kotlin-react declares the npm react, kotlin-react-dom declares react-dom: the versions
# travel with the klibs.
kotlin-react = { module = "org.jetbrains.kotlin-wrappers:kotlin-react", version.ref = "react" }
kotlin-react-dom = { module = "org.jetbrains.kotlin-wrappers:kotlin-react-dom", version.ref = "react" }
kotlin-mui-material = { module = "org.jetbrains.kotlin-wrappers:kotlin-mui-material", version.ref = "mui" }
kotlin-testing-library-react = { module = "org.jetbrains.kotlin-wrappers:kotlin-testing-library-react", version.ref = "testing-library-react" }
kotlin-testing-library-dom = { module = "org.jetbrains.kotlin-wrappers:kotlin-testing-library-dom", version.ref = "testing-library-dom" }

playwright = { module = "com.microsoft.playwright:playwright", version.ref = "playwright" }
hutool-all = { module = "cn.hutool:hutool-all", version.ref = "hutool" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-pioneer = { module = "org.junit-pioneer:junit-pioneer", version.ref = "junit-pioneer" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }

# The annotation processor the `-ksp` module compiles against. It ships from the KSP release,
# so it shares the `ksp` version with the plugin.
symbol-processing-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }

ktjs-docusaurus = { module = "io.github.shijianjs:ktjs-docusaurus", version.ref = "ktjs-docusaurus" }
ktjs-docusaurus-kit = { module = "io.github.shijianjs:ktjs-docusaurus-kit", version.ref = "ktjs-docusaurus-kit" }
# The kit's browser half is a klib resource, not a type anyone compiles against:
# resolved with `@klib` from the `-js` coordinate, which the catalog cannot express.
ktjs-docusaurus-kit-js = { module = "io.github.shijianjs:ktjs-docusaurus-kit-js", version.ref = "ktjs-docusaurus-kit" }

[plugins]
# The Kotlin Gradle plugin is declared once, in the root build (`apply false`). Modules apply
# `kotlin("multiplatform")` by id without a version, so no alias is defined for it here.
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# Same for KSP: applied by id in the modules, declared once in the root build.
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
ktjs-docusaurus = { id = "io.github.shijianjs.ktjs.docusaurus", version.ref = "ktjs-docusaurus-gradle-plugin" }